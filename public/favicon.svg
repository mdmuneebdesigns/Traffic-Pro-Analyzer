<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background glow container -->
  <defs>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Traffic Light Body -->
  <rect x="25" y="10" width="50" height="80" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2.5" />

  <!-- Red Light -->
  <circle cx="50" cy="27" r="9" fill="#EF4444" filter="url(#glow-red)" />
  <circle cx="47" cy="24" r="2.5" fill="#FFFFFF" opacity="0.6" />

  <!-- Yellow Light -->
  <circle cx="50" cy="50" r="9" fill="#F59E0B" opacity="0.9" />
  <circle cx="47" cy="47" r="2.5" fill="#FFFFFF" opacity="0.6" />

  <!-- Green Light -->
  <circle cx="50" cy="73" r="9" fill="#10B981" filter="url(#glow-green)" />
  <circle cx="47" cy="70" r="2.5" fill="#FFFFFF" opacity="0.6" />
</svg>
